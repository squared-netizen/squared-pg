name: Build API Documentation

'on':
  workflow_dispatch:

permissions:
  contents: read

env:
  GENERATOR_VERSION: 0.4.0

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Install documentation host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            doxygen \
            lua5.4 \
            ninja-build \
            unzip

      - name: Fetch and verify SDL Project Generator
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/squared-netizen/sdl-project-generator/releases/download/v${GENERATOR_VERSION}"
          ARCHIVE="sdl-project-generator-${GENERATOR_VERSION}.zip"

          curl -fL "${BASE}/${ARCHIVE}" -o "${RUNNER_TEMP}/${ARCHIVE}"
          curl -fL \
            "${BASE}/${ARCHIVE}.sha256" \
            -o "${RUNNER_TEMP}/${ARCHIVE}.sha256"

          (
            cd "${RUNNER_TEMP}"
            sha256sum -c "${ARCHIVE}.sha256"
            unzip -q "${ARCHIVE}"
          )

      - name: Build private documentation toolchain
        shell: bash
        run: |
          set -euo pipefail
          GENERATOR="${RUNNER_TEMP}/sdl-project-generator-${GENERATOR_VERSION}"
          lua5.4 "${GENERATOR}/toolchain.lua"

      - name: Generate API documentation
        shell: bash
        run: |
          set -euo pipefail
          GENERATOR="${RUNNER_TEMP}/sdl-project-generator-${GENERATOR_VERSION}"

          "${GENERATOR}/build/private-lua/bin/lua-5.4.8" \
            "${GENERATOR}/tools/private-run.lua" \
            "${GENERATOR}/sdl-pg.lua" \
            docs

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: {{PROJECT_ID}}-api-documentation
          path: build/docs/
          if-no-files-found: error
          retention-days: 30
