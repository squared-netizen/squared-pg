# squared-pg — continuous integration.
#
# One build: build.lua, by sqmake, with clang and libc++ (C++23; sq.cart's
# modules and `import std;`), as on Termux. tools/ci-toolchain.sh installs
# them, and bootstraps sqmake from its source with them (no make).
#
# No network is used by the build itself: everything squared-pg compiles is
# vendored. The jobs do reach the network once, before building, to assemble
# the tree -- squared-pg is three repositories and a bare checkout is not a
# buildable tree (tools/bootstrap.sh) -- and to install the toolchain.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]  # Linux only for now: no macOS or iOS target yet

    steps:
      - uses: actions/checkout@v6

      - name: assemble
        run: ./tools/bootstrap.sh

      - name: clang and libc++
        run: |
          ./tools/ci-toolchain.sh "$RUNNER_TEMP/llvm"
          echo "$RUNNER_TEMP/llvm" >> "$GITHUB_PATH"
          echo "CXX=$RUNNER_TEMP/llvm/clang++" >> "$GITHUB_ENV"
          echo "CC=$RUNNER_TEMP/llvm/clang" >> "$GITHUB_ENV"

      - name: build
        run: sqmake

      - name: engine tests
        run: sqmake test
        env:
          TMPDIR: ${{ runner.temp }}

      # A generated workspace builds with sqmake too: the smoke test builds
      # and runs one, with the sqmake ci-toolchain.sh made.
      - name: end-to-end smoke
        run: sqmake smoke
        env:
          TMPDIR: ${{ runner.temp }}

      - name: sqpg finds its installation
        run: |
          ./build/sqpg list
          ./build/sqpg describe

      - name: incremental rebuild after touching a source
        run: |
          touch engine/src/services/project_service.cpp
          sqmake
      - name: incremental rebuild after touching a header
        run: |
          touch engine/src/services/services.hpp
          sqmake

  sqcart:
    name: sqcart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: assemble
        run: ./tools/bootstrap.sh

      - name: clang and libc++
        run: ./tools/ci-toolchain.sh "$RUNNER_TEMP/llvm"

      - name: build and test
        run: CXX="$RUNNER_TEMP/llvm/clang++" CC="$RUNNER_TEMP/llvm/clang" "$RUNNER_TEMP/llvm/sqmake" -C sqcart/v3 test
        env:
          TMPDIR: ${{ runner.temp }}

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: version is single-sourced
        run: sh tools/version-check.sh

      - name: manifests are valid JSON
        run: |
          fail=0
          for m in $(find resources -name manifest.json) \
                   $(find lua/workflows -name workflow.json); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$m" \
              || { echo "invalid: $m" >&2; fail=1; }
          done
          exit $fail

      - name: shell scripts parse
        run: |
          fail=0
          for s in $(find tools -name '*.sh'); do
            # bash -n for the bash scripts, sh -n for the POSIX ones. Checking
            # everything with sh would reject valid bash; checking everything
            # with bash would let a bashism into a POSIX script unnoticed.
            if head -n 1 "$s" | grep -q bash; then
              bash -n "$s" || { echo "syntax error: $s" >&2; fail=1; }
            else
              sh -n "$s" || { echo "syntax error: $s" >&2; fail=1; }
            fi
          done
          exit $fail

      # The tooling is bash now (D-043), which means CI can actually execute
      # it. `check` runs the full build and test matrix itself, so hygiene runs
      # only the parts that are cheap and self-contained.
      - name: release tooling runs
        run: |
          tools/release.sh status
          tools/release.sh --help >/dev/null
        env:
          TMPDIR: ${{ runner.temp }}

      # fish is developer tooling (§1.7) and is the one language in the tree
      # that nothing else exercises. Two real bugs shipped in release.fish
      # because neither the author nor CI could run it: shadowing fish's
      # read-only $version, and reading a top-level `set --local` from inside a
      # function, which fish does not permit and does not warn about.
      - name: install fish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish

      - name: fish scripts parse and scope correctly
        run: python3 tools/fish-lint.py

      - name: no generated workspace was committed
        run: |
          # A stray `sqpg new` in the repository root is easy to do and would
          # ship someone's scratch project in the release tarball.
          # Match the metadata file, not the directory name. bootstrap.sh
          # clones the squared repository to resources/.squared, which shares
          # its name with a workspace's metadata directory and would otherwise
          # be reported here. Only a real workspace has the record inside it.
          if find . -path '*/.squared/metadata.json' -not -path './.git/*' | grep -q .; then
            echo "a generated workspace is committed:" >&2
            find . -path '*/.squared/metadata.json' -not -path './.git/*' >&2
            exit 1
          fi
